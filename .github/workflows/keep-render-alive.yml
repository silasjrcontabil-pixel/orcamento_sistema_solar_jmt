name: Keep Render Alive

# Bate no /health do backend a cada 10 min pra evitar o "sleep" por inatividade do
# Render free (~15 min sem tráfego). Cron do GitHub Actions não é garantido no minuto
# exato (pode atrasar alguns minutos em períodos de carga alta), mas é o suficiente na
# prática para manter o serviço acordado.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS https://orcamento-sistema-solar-jmt.onrender.com/health
